<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>Pi Web</title>
    <style>
      :root {
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
      }
      html, body { height: 100%; margin: 0; }
      body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        background: #f5f5f3;
        color: #1a1a18;
      }
      html.dark body { background: #212121; color: #e8e8e6; }
    </style>
    <script>
      (function () {
        try {
          var m = localStorage.getItem("pi-theme-mode");
          var t = localStorage.getItem("pi-theme");
          var dark = false;
          if (m === "dark" || t === "dark") dark = true;
          else if (m === "light" || t === "light") dark = false;
          else dark = !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var a = localStorage.getItem("pi-appearance");
          if (a) {
            try {
              var p = JSON.parse(a);
              if (p && p.uiFontSize) document.documentElement.style.setProperty("--ui-font-size", p.uiFontSize + "px");
            } catch (_) {}
          }
          var l = localStorage.getItem("pi-locale");
          if (l === "zh" || l === "en") document.documentElement.lang = l;
          else {
            var n = (navigator.language || "").toLowerCase();
            document.documentElement.lang = n.indexOf("zh") === 0 ? "zh" : "en";
          }
          if (window.piDesktop && window.piDesktop.isDesktop) {
            var r = document.documentElement;
            r.classList.add("pi-desktop");
            var plat = window.piDesktop.platform;
            if (plat === "darwin") r.classList.add("pi-desktop-mac");
            else if (plat === "win32") r.classList.add("pi-desktop-win");
            else if (plat === "linux") r.classList.add("pi-desktop-linux");
            if (typeof window.piDesktop.setTheme === "function") {
              window.piDesktop.setTheme(r.classList.contains("dark") ? "dark" : "light");
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body translate="no" class="notranslate">
    <div id="root" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
